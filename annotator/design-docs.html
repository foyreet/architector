<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Дизайн-документы · Архитектор</title><link rel="stylesheet" href="/design-docs.css"><link rel="stylesheet" href="/design-chat.css"><style>#auth,#catalog,#search-form,#publish-dialog{display:none!important}</style></head><body>
<header><a id="back-schema" href="/architecture.html">← К схеме</a><span class="brand">Архитектор</span><span id="account"></span></header>
<p id="message" role="status" aria-live="polite" hidden></p>
<section id="auth" class="auth" hidden><h1>Войти в Архитектор</h1><form id="login-form"><label>Логин<input id="username" autocomplete="username" required minlength="3"></label><label>Пароль<input id="password" type="password" autocomplete="current-password" required minlength="10"></label><button class="primary" type="submit">Войти</button><button id="register" type="button">Создать аккаунт</button></form></section>
<main id="list" hidden><div class="list-heading"><h1>Дизайн-документы</h1><button id="create" class="primary">+ Создать дизайн-документ</button></div><nav class="tabs" aria-label="Источник документов"><button id="mine" aria-current="page">Мои документы</button><button id="catalog">Каталог сообщества</button></nav><form id="search-form" hidden><label class="search-label" for="search">Поиск по названию или автору</label><div class="search-row"><input id="search" type="search"><button type="submit">Найти</button></div></form><div id="documents"></div></main>
<main id="editor" hidden><div class="editor-toolbar"><button id="back-list">← Мои документы</button><div class="actions"><button id="save" class="primary">Сохранить</button><button id="add-chat">Добавить в AI Chat</button><button id="publish">Опубликовать</button><button id="copy" class="primary" hidden>Сохранить себе</button></div></div><p id="save-status" class="muted" role="status" aria-live="polite"></p><p id="editor-error" role="alert" hidden></p><div id="conflict" hidden><p>Сохранённая версия изменилась. Ваш текст остался в полях.</p><div class="actions"><button id="save-separate">Сохранить мой вариант отдельно</button><button id="reload-saved">Загрузить сохранённую версию</button></div></div><p id="publication-info" class="muted" hidden></p><label id="title-label" for="title">Название документа</label><input id="title" value="Новый дизайн-документ"><h1 id="read-title" hidden></h1><div id="sections"></div></main>
<dialog id="publish-dialog"><div class="dialog-heading"><h2>Публикация документа</h2><button id="preview-close" aria-label="Закрыть предпросмотр">×</button></div><p>Всем посетителям каталога будет доступна эта версия. Дальнейшие личные правки её не изменят.</p><p id="publish-error" role="alert" hidden></p><h3 id="preview-title"></h3><div id="preview-sections"></div><div class="dialog-actions"><button id="publish-cancel">Отмена</button><button id="publish-confirm" class="primary">Опубликовать в каталоге</button></div></dialog>
<script src="/design-chat.js"></script><script src="/design-docs.js"></script></body></html>
