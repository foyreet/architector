<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Пространство решений · Архитектор</title><link rel="stylesheet" href="/design-docs.css"><link rel="stylesheet" href="/solution-space.css"></head><body>
