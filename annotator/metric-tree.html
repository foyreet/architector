<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Иерархия метрик · Архитектор</title><link rel="stylesheet" href="/design-docs.css"><link rel="stylesheet" href="/problem-space.css"></head><body class="space-page metrics-page">
<header><a id="back-schema" href="/architecture.html">← К схеме</a><h1 class="visually-hidden">Иерархия метрик</h1><nav id="design-flow" class="design-flow" aria-label="Этапы дизайн-документа"><ol><li><a data-step="problems" href="/problem-space.html"><span class="step-number" aria-hidden="true">1</span><span class="step-label">Проблемы</span></a></li><li><a data-step="solutions" href="/solution-space.html"><span class="step-number" aria-hidden="true">2</span><span class="step-label">Решения</span></a></li><li><span aria-current="step"><span class="step-number" aria-hidden="true">3</span><span class="step-label">Метрики</span></span></li><li><a data-step="document" href="/design-docs.html"><span class="step-number" aria-hidden="true">4</span><span class="step-label">Дизайн-документ</span></a></li></ol></nav><span id="status" role="status"></span><button id="save" class="primary">Сохранить</button></header>
<main id="space"><div class="space-actions"><input id="title" aria-label="Название дерева" value="Новое дерево"><button id="library">Деревья метрик</button><span class="space-divider" aria-hidden="true"></span><button id="add-root">Добавить метрику</button><button id="tree-ai-open" aria-expanded="false" aria-controls="tree-ai">Предложить метрики с AI</button><span id="tree-progress" aria-live="polite"></span></div>
<div class="problem-layout"><section class="tree-board" aria-label="Дерево метрик">
<div class="tree-controls"><button id="tree-smaller" aria-label="Уменьшить масштаб">−</button><output id="tree-scale" aria-label="Масштаб">100%</output><button id="tree-larger" aria-label="Увеличить масштаб">+</button><button id="tree-fit">Вписать дерево</button><button id="tree-all" hidden>Все ветви</button></div>
<div id="tree-viewport" tabindex="0" aria-label="Полотно дерева"><div id="tree-map"><button id="tree-origin" type="button" aria-label="Редактировать бизнес-цель"><span></span></button><div id="tree-branches" aria-label="Ветви метрик"></div></div></div></section><section id="question-editor" aria-label="Редактирование метрики"></section><section id="tree-ai" hidden aria-labelledby="tree-ai-title">
<h2 id="tree-ai-title">Предложение AI</h2>
<label for="tree-request">Опишите задачу или укажите, что хотите уточнить</label><textarea id="tree-request" rows="3"></textarea>
<label for="tree-target">Куда добавить метрики</label><select id="tree-target"><option value="root">К бизнес-цели</option><option value="branch">К выбранной метрике</option></select>
<p class="muted">Модель получит ваш запрос, бизнес-цель и текущее дерево. <a id="tree-ai-settings" href="/architecture.html?chat=1" target="_blank" rel="noopener">Настроить модель в AI Chat ↗</a></p>
<div class="actions"><button id="tree-generate">Запросить метрики</button><button id="tree-cancel">Отмена</button></div>
<p id="tree-ai-status" role="status"></p><div id="tree-proposal" hidden><h3>Предложенные метрики</h3><div id="tree-preview"></div><button id="tree-apply" class="primary">Добавить в дерево</button></div>
</section></div></main>
<dialog id="trees"><h2>Деревья метрик</h2><div id="entries"></div><div class="actions"><button id="new">Новое дерево</button><button id="export">Экспорт JSON</button><button id="import">Импорт JSON</button><button data-close>Закрыть</button></div></dialog>
<dialog id="root-editor"><label for="formulation">Бизнес-цель</label><textarea id="formulation"></textarea><button data-close>Готово</button></dialog>
<script src="/problem-space.js"></script><script src="/tree-workspace.js"></script><script src="/design-flow.js"></script></body></html>
