<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Пространство проблем · Архитектор</title><link rel="stylesheet" href="/design-docs.css"><link rel="stylesheet" href="/problem-space.css"></head><body class="space-page">
<header><a id="back-schema" href="/architecture.html">← К схеме</a><h1>Пространство проблем</h1><button id="library">Мои деревья</button><input id="title" aria-label="Название дерева" value="Новое дерево"><button id="save" class="primary">Сохранить</button></header>
<main id="space"><div class="space-actions"><button id="add-root">Добавить общий вопрос</button><button id="tree-ai-open" aria-expanded="false" aria-controls="tree-ai">Предложить вопросы с AI</button><span id="status" role="status"></span></div>
<section id="tree-ai" hidden aria-labelledby="tree-ai-title">
<h2 id="tree-ai-title">Предложение AI</h2>
<label for="tree-request">Опишите задачу или укажите, что хотите уточнить</label><textarea id="tree-request" rows="3"></textarea>
<label for="tree-target">Куда добавить вопросы</label><select id="tree-target"><option value="root">Новые общие вопросы</option><option value="branch">Уточнения к выбранному вопросу</option></select>
<p class="muted">Модель получит ваш запрос, формулировку проблемы и текущее дерево. <a id="tree-ai-settings" href="/architecture.html?chat=1" target="_blank" rel="noopener">Настроить модель в AI Chat ↗</a></p>
<div class="actions"><button id="tree-generate">Запросить вопросы</button><button id="tree-cancel">Отмена</button></div>
<p id="tree-ai-status" role="status"></p><div id="tree-proposal" hidden><h3>Предложенные вопросы</h3><div id="tree-preview"></div><button id="tree-apply" class="primary">Добавить в дерево</button></div>
</section>
<div class="problem-layout"><section class="tree-board" aria-label="Дерево вопросов">
<div class="tree-controls"><button id="tree-smaller" aria-label="Уменьшить масштаб">−</button><output id="tree-scale" aria-label="Масштаб">100%</output><button id="tree-larger" aria-label="Увеличить масштаб">+</button><button id="tree-fit">Вписать дерево</button><button id="tree-all" hidden>Все ветви</button></div>
<div id="tree-viewport" tabindex="0" aria-label="Полотно дерева"><div id="tree-map"><button id="tree-origin" type="button" aria-label="Редактировать формулировку проблемы"><span></span></button><div id="tree-branches" aria-label="Ветви вопросов"></div></div></div></section><section id="question-editor" aria-label="Редактирование вопроса"></section></div></main>
<dialog id="trees"><h2>Мои деревья</h2><div id="entries"></div><div class="actions"><button id="new">Новое дерево</button><button id="export">Экспорт JSON</button><button id="import">Импорт JSON</button><button data-close>Закрыть</button></div></dialog>
<dialog id="root-editor"><label for="formulation">Формулировка проблемы</label><textarea id="formulation"></textarea><button data-close>Готово</button></dialog>
<script src="/problem-space.js"></script><script src="/tree-workspace.js"></script></body></html>
