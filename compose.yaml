services:
  python-image:
    image: architector-python:local
    build: ./deploy/python-sandbox
    entrypoint: ["python", "-c", "print('Python image ready')"]
    network_mode: none
  runner:
    image: architector-app:local
    build: .
    command: ["python", "code_sandbox.py", "--socket", "/run/architect-code/runner.sock"]
    depends_on:
      python-image:
        condition: service_completed_successfully
    environment:
      ARCHITECTOR_PYTHON_MEMORY_MB: ${ARCHITECTOR_PYTHON_MEMORY_MB:-1024}
      ARCHITECTOR_PYTHON_CPUS: ${ARCHITECTOR_PYTHON_CPUS:-2}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runner-socket:/run/architect-code
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(socket.AF_UNIX); s.connect('/run/architect-code/runner.sock'); s.close()"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  app:
    image: architector-app:local
    build: .
    depends_on:
      runner:
        condition: service_healthy
    ports:
      - "127.0.0.1:8770:8770"
    volumes:
      - ./data:/data
      - runner-socket:/run/architect-code
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: ${ARCHITECTOR_APP_MEMORY:-4g}
    cpus: ${ARCHITECTOR_APP_CPUS:-2}
    restart: unless-stopped
volumes:
  runner-socket:
